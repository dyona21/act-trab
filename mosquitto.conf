# Configuração do Eclipse Mosquitto equivalente à da API HTTP / Uvicorn
# - Processo único
# - Sem autenticação e sem TLS
# - Sem persistência em disco
# - Logs desativados no caminho crítico para não distorcer a latência

listener 1883 0.0.0.0
allow_anonymous true
persistence false
log_dest none
max_connections -1
max_queued_messages 10000

